[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reach"
version = "0.1.0"
description = "Reach: voice-controlled assistive robotics kit (prototype)"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
# The real follower arm uses the Seeed LeRobot fork installed in the `lerobot` conda env
# (see ../SETUP_ARMS.md); it is not pinned here so mocks run without it.
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["reach*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
